name: Optimizer stage 2 CI

on:
  push:
    branches:
      - feat/optimizer-stage2
    paths:
      - backend/**
      - .github/workflows/optimizer-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/optimizer-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile optimizer package
        run: python -m compileall -q backend/optimizer
      - name: Run API and algorithm unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
